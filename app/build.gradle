plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.neverhide.nevercutapp'
    compileSdk 34
    defaultConfig {
        applicationId "com.neverhide.nevercutapp"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    signingConfigs {
        release {
            storeFile rootProject.file('nevercut.jks')
            storePassword 'NeverCut2026!'
            keyAlias 'nevercut'
            keyPassword 'NeverCut2026!'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {}
